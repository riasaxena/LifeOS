name: LifeOS
options:
  bundleIdPrefix: com.riasaxena
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  LifeOS:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
    info:
      path: App/Sources/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: LifeOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.riasaxena.lifeos
        TARGETED_DEVICE_FAMILY: 1
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
